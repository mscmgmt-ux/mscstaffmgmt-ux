<!doctype html>
<!-- design-2 / 入口（ブランド面 + 4桁コード）
     ※ 氏名・イベント名はすべて架空のダミー。API 呼び出しなし。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MSC EventOps</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<style>
  body { padding-bottom: var(--s4); }
  .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: var(--s4); }
</style>
</head>
<body>
<a class="skip" href="#main">本文へスキップ</a>

<div class="wrap">
  <main id="main" class="hero">

    <div class="brand">
      <!-- 参考画像はスタッフ3人の線画。ロゴは自前で描いたもの。 -->
      <svg class="logo" width="104" height="104" viewBox="0 0 104 104" fill="none" aria-hidden="true">
        <circle cx="52" cy="30" r="12" stroke="#FF3B45" stroke-width="2.5"/>
        <path d="M32 74c0-11 9-20 20-20s20 9 20 20" stroke="#FF3B45" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="22" cy="44" r="9" stroke="#FF3B45" stroke-width="2" opacity=".75"/>
        <path d="M6 80c0-9 7-16 16-16 4 0 8 1.4 11 4" stroke="#FF3B45" stroke-width="2" stroke-linecap="round" opacity=".75"/>
        <circle cx="82" cy="44" r="9" stroke="#FF3B45" stroke-width="2" opacity=".75"/>
        <path d="M98 80c0-9-7-16-16-16-4 0-8 1.4-11 4" stroke="#FF3B45" stroke-width="2" stroke-linecap="round" opacity=".75"/>
      </svg>
      <p class="name">MSC<i>EventOps</i></p>
      <p class="tag">イベントを、みんなで成功へ。</p>
    </div>

    <div>
      <div class="note note--red">
        <b aria-hidden="true">●</b>
        <span><b>デザイン検討用のプロトタイプです。</b>
        氏名・イベント名はすべて架空のダミーで、送信しても何も保存されません。</span>
      </div>

      <div class="field">
        <label for="code">共通コード（4桁）</label>
        <input class="input code" id="code" type="text" inputmode="numeric"
               pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="––––">
        <p class="hint">事務局から LINE またはメールでご案内した4桁の数字です。</p>
      </div>

      <a class="btn btn--outline btn--block" href="home.html">はじめる</a>
      <p class="hint" style="text-align:center;margin-top:var(--s2)">
        コードが分からない場合は事務局までご連絡ください。
      </p>
    </div>

  </main>
</div>
</body>
</html>
